# ── Apologia source manifest ────────────────────────────────────────────────
#
# One entry per work. This file is the contract between the corpus and the
# ingestion pipeline (ADR-004). The repository ships THIS FILE, never the text
# it describes (ADR-003).
#
# RULES
#   * `license` is required and must be resolved. There is no `unknown`.
#     A source whose status has not been established does not go in this file —
#     it goes in docs/corpus.md § Pending licence resolution until it has been.
#   * `authority_tier` is assigned by a human, never inferred (ADR-010).
#     Scientific/historical works take `source_kind: scientific` and NO tier.
#   * `chunking` names a strategy; there is deliberately no default (ADR-002).
#   * `locator_scheme` defines how a citable unit in this work is addressed.
#
# STATUS: Milestone 0. These are the entries whose licence status is settled.
# Milestone 1 ingests `ccc` alone, end to end, and measures it.

version: 0

sources:
  - id: ccc
    title: Catechism of the Catholic Church
    kind: church_document
    authority_tier: 2
    author: Catholic Church
    languages: [hu, en]
    license: lev-copyright-cite-and-link
    license_note: >
      Copyright Libreria Editrice Vaticana, which licenses national editions
      (Szent István Társulat in Hungary, USCCB in the United States). NOTE: it is
      equally restricted in English — going English-only buys nothing here.
      Posture: ingest full text for retrieval, display locator + link to the
      official edition, quote minimally if at all. Embedding into a private index
      is not redistribution. See ADR-014.
    locator_scheme: "ccc:<paragraph>"          # ccc:1730
    chunking: numbered-paragraph
    cross_lingual_key: paragraph
    notes: >
      The Milestone 1 source, ingested in BOTH languages. Paragraph numbering is
      identical across translations, so the same citable unit exists in Hungarian
      and English under one identifier — the free alignment key the cross-lingual
      evaluation is built on (ADR-002, ADR-007). Ingesting both costs nothing
      extra in licensing, since both editions carry the same LEV terms.

  - id: summa
    title: Summa Theologiae
    kind: theological_work
    authority_tier: 3
    author: Thomas Aquinas
    languages: [en]
    license: public-domain
    license_note: >
      Author died 1274. The English Fathers of the English Dominican Province
      translation (1920) is also out of copyright.
    locator_scheme: "summa:<part>.q<question>.a<article>"   # summa:I.q2.a3
    chunking: scholastic-article
    notes: >
      Structurally the most interesting source: each article is objections →
      sed contra → respondeo → replies. That structure is semantically load
      bearing — an objection says the OPPOSITE of the article's conclusion, so
      a chunker that loses the role of a passage will retrieve objections as
      though they were teaching. See docs/corpus.md § Why chunking is per-source.

  - id: kjv
    title: King James Version
    kind: bible
    authority_tier: 1
    author: null
    languages: [en]
    license: public-domain
    license_note: >
      Public domain outside the United Kingdom. Chosen on availability grounds.
      For Hungarian Scripture the public-domain Catholic option is Káldi 1626 —
      see docs/corpus.md § The Hungarian Bible question. Modern translations in
      either language are cited and linked, never reproduced (ADR-014).
    locator_scheme: "bible:<book>:<chapter>:<verse>"        # bible:jn:1:1-14
    chunking: pericope
    cross_lingual_key: verse

# ── Not yet in the manifest ─────────────────────────────────────────────────
# Encyclicals, the conciliar documents, the Church Fathers, Káldi 1626, and
# contemporary Hungarian apologetics are CANDIDATES, not entries. Each needs its
# licence resolved first. See docs/corpus.md § Pending licence resolution.
