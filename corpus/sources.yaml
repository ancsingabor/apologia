# ── Apologia source manifest ────────────────────────────────────────────────
#
# One entry per work. This file is the contract between the corpus and the
# ingestion pipeline (ADR-004). The repository ships THIS FILE, never the text
# it describes (ADR-003).
#
# RULES
#   * `license` is required and must be resolved. There is no `unknown`.
#     A source whose status has not been established does not go in this file —
#     it goes in docs/corpus.md § Pending licence resolution until it has been.
#   * `authority_tier` is assigned by a human, never inferred (ADR-010).
#     Scientific/historical works take `kind: scientific` and NO tier. (The
#     Postgres enum type is called `source_kind`; the field here is `kind`.)
#   * `chunking` names a strategy; there is deliberately no default (ADR-002).
#   * `locator_scheme` defines how a citable unit in this work is addressed.
#
# These are the entries whose licence status is settled. An entry here is a
# DECLARATION, not a report: it says what the work is and how it may be used,
# never whether it has been fetched. What has actually been ingested, with
# counts, is docs/guide/status.md, re-derived from a run; what a run produced is
# `corpus/manifest.lock.yaml` — generated, committed, carrying hashes and counts
# and no corpus text. Do not restate either here; both drift within days.
#
# A source with no `documents:` block has not reached the fetch stage. That is a
# legitimate state — asking to ingest such a source is what fails, in `select`.

version: 0

sources:
  - id: ccc
    title: Catechism of the Catholic Church
    kind: church_document
    authority_tier: 2
    author: Catholic Church
    languages: [hu, en]
    license: lev-copyright-cite-and-link
    license_note: >
      Copyright Libreria Editrice Vaticana, which licenses national editions
      (Szent István Társulat in Hungary, USCCB in the United States). NOTE: it is
      equally restricted in English — going English-only buys nothing here.
      Posture: ingest full text for retrieval, display locator + link to the
      official edition, quote minimally if at all. Embedding into a private index
      is not redistribution. See ADR-014.
    locator_scheme: "ccc:<paragraph>"          # ccc:1730
    chunking: numbered-paragraph
    cross_lingual_key: paragraph
    canonical_url: https://www.vatican.va/archive/ENG0015/_INDEX.HTM
    expected_units: 2865                       # numbered paragraphs; asserted at ingest

    # ── documents ───────────────────────────────────────────────────────────
    # One entry per (language, revision) — the manifest side of the `documents`
    # table in 0005_corpus. `revision` is REQUIRED and the entries here must
    # agree on it: a multilingual source whose translations descend from
    # different revisions has numbering that aligns and content that does not,
    # which silently falsifies the cross-lingual identity ADR-002 claims for a
    # locator. See ADR-019 for the §2267 case that settled this.
    documents:
      - language: hu
        revision: "1997+2018"
        edition: null
        # ⚠️ NOT inferred. Szent István Társulat is the LEV licensee for Hungary,
        # but the pages credit no publisher and the archive credits translators
        # only inside HTML comments. Naming an unconfirmed edition is the same
        # error as inferring an authority_tier (ADR-010). Open — ADR-019.
        index_url: https://katolikus.hu/cikk/a-katolikus-egyhaz-katekizmusa
        fetch: katolikus-hu-toc                  # 31 pages; NOT pinned — ADR-019
        parser: katolikus-hu-numbered-paragraph
        encoding: utf-8
        errata: corpus/errata/ccc-hu.yaml
        inventoried: 2026-09-07                 # parsed, not merely anchor-counted
        parsed_units: 2865                      # complete — see ADR-019 § Amendment

      - language: en
        revision: "1997+2018"
        edition: null
        # ⚠️ NOT inferred, same rule as the Hungarian entry. The USCCB is the LEV
        # licensee in the United States, but the IntraText pages credit only
        # "Libreria Editrice Vaticana" and their printed-source note names the
        # LATIN 1993 typica. Open — ADR-019.
        index_url: https://www.vatican.va/archive/ENG0015/_INDEX.HTM
        fetch: vatican-intratext-toc             # 374 pages; NOT pinned — ADR-019
        parser: vatican-intratext
        encoding: iso-8859-1                     # HTML 3.2, declared charset
        errata: corpus/errata/ccc-en.yaml
        inventoried: 2026-09-08                 # parsed, not merely link-counted
        parsed_units: 2865                      # complete — see ADR-020
        # Revision verified against §2267 (ADR-019) and re-confirmed by the
        # inventory parse. Completeness now established: §1–§2865, contiguous,
        # no misnumbering. This source states each paragraph number ONCE, so the
        # anchor-agreement assertion cannot run over it — ADR-020 says what pays
        # for that.
    notes: >
      The Milestone 1 source, ingested in BOTH languages. Paragraph numbering is
      identical across translations, so the same citable unit exists in Hungarian
      and English under one identifier — the alignment key the cross-lingual
      evaluation is built on (ADR-002, ADR-007). Ingesting both costs nothing
      extra in licensing, since both editions carry the same LEV terms.

      This note used to call that alignment key FREE. What is free is the
      numbering; unit *identity* additionally requires that both documents
      descend from the same revision, which is a property of the fetch and has to
      be established. ADR-019 is where that was paid for.

      Fetch locations settled in ADR-019. `archiv.katolikus.hu/kek/` is REJECTED
      despite better file ergonomics: it is the 1997 editio typica, so its §2267
      contradicts the 2018-amended English text under the same locator.

  - id: summa
    title: Summa Theologiae
    kind: theological_work
    authority_tier: 3                          # Aquinas. NOT the Supplementum.
    author: Thomas Aquinas
    languages: [la]
    license: public-domain
    license_note: >
      THE WORK. Author died 1274; the Leonine edition was printed in 1888. There
      is no live copyright in either. This says nothing about any particular
      transcription of it — see the document entry below, and ADR-021 for why
      that is a separate field rather than a longer sentence here.
    locator_scheme: "summa:<part>.q<question>.a<article>.<role><n>"  # summa:I.q2.a3.arg1
    chunking: scholastic-article
    cross_lingual_key: null                    # one language; nothing to align
    canonical_url: https://www.corpusthomisticum.org/iopera.html
    expected_units: 23326                      # asserted at ingest

    # ── documents ───────────────────────────────────────────────────────────
    documents:
      - language: la
        revision: leonina-1888
        edition: Textus Leoninus (Romae 1888), rec. Busa/Alarcón
        index_url: https://www.corpusthomisticum.org/iopera.html
        fetch: corpus-thomisticum-index          # 87 pages; NOT pinned — ADR-019
        parser: corpus-thomisticum-scholastic
        encoding: iso-8859-1                     # HTML 4.0, declared charset
        errata: corpus/errata/summa-la.yaml
        inventoried: 2026-09-09                  # parsed, all 87 pages
        parsed_units: 23326                      # complete — see ADR-022

        # ⚠️ THE TRANSCRIPTION IS NOT THE WORK, AND THIS IS WHERE THEY DIFFER.
        # `© Fundación Tomás de Aquino quoad hanc editionem. Iura omnia
        # asservantur.` The Leonine text is public domain; what is reserved is
        # this digitisation of it — Busa's tape transcription and Alarcón's
        # recension. Posture, per ADR-021: ingest for retrieval, never persist
        # the editorial apparatus, display locator + link (ADR-014).
        license: transcription-rights-reserved
        license_note: >
          Fundación Tomás de Aquino, over the edition rather than the text.
          The Index Thomisticus reference numbers — the `[28299]` prefixes —
          are the clearest editorial contribution and are used at parse time as
          a check signal and discarded. Stored text is Leonine Latin only.
    notes: >
      Structurally the most interesting source: each article is objections →
      sed contra → respondeo → replies. That structure is semantically load
      bearing — an objection says the OPPOSITE of the article's conclusion, so
      a chunker that loses the role of a passage will retrieve objections as
      though they were teaching. See docs/corpus.md § Why chunking is per-source.

      512 questions — I 1–119, I-II 1–114, II-II 1–189, III 1–90 — and 2,669
      articles, both matching the figures in the scholarly literature, which is
      the only corroboration here from outside the source. 23,326 units.

      Ingested in LATIN ONLY, so `compareLocators` cannot run and the check that
      found every Catechism defect the structural assertions were blind to is
      unavailable. ADR-022 records what pays for it: the article count each
      question states in its own prooemium, which Aquinas wrote and no
      transcriber supplied. It agrees for 500 of the 501 questions that state
      a countable numeral.

      The Supplementum (q. 1–99) is EXCLUDED. corpusthomisticum.org credits it
      to Fr. Rainaldus Romanus — Reginald of Piperno compiled it after Thomas
      died, out of the earlier Scriptum — and hosts it off the `sth` scheme, so
      the discoverer excludes it by the source's own attribution rather than by
      our convenience. `authority_tier: 3` is assigned to Aquinas (ADR-010) and
      is not ours to lend to a compiler working from his notes.

  - id: kjv
    title: King James Version
    kind: bible
    authority_tier: 1
    author: null
    languages: [en]
    license: public-domain
    license_note: >
      Public domain outside the United Kingdom. Chosen on availability grounds.
      For Hungarian Scripture the public-domain Catholic option is Káldi 1626 —
      see docs/corpus.md § The Hungarian Bible question. Modern translations in
      either language are cited and linked, never reproduced (ADR-014).
    locator_scheme: "bible:<book>:<chapter>:<verse>"        # bible:jn:1:1-14
    chunking: pericope
    cross_lingual_key: verse

# ── Not yet in the manifest ─────────────────────────────────────────────────
# Encyclicals, the conciliar documents, the Church Fathers, Káldi 1626, and
# contemporary Hungarian apologetics are CANDIDATES, not entries. Each needs its
# licence resolved first. See docs/corpus.md § Pending licence resolution.
