# ── Errata: Catechism of the Catholic Church, Hungarian ─────────────────────
#
# Source: katolikus.hu/dokumentumtar/kek-*  (ADR-019)
# Parser: lib/corpus/parsers/katolikus-hu.ts
# Inventoried: 2026-09-07 · re-inventoried by the parser 2026-09-07
#
# ⚠️ THIS FILE WAS WRONG ON ITS CENTRAL CLAIM AND HAS BEEN REPLACED.
#
# The first version was derived by analysing anchors alone, and concluded that
# §146 was missing and the corpus was 2,864 of 2,865 paragraphs. Both are false.
# Running an actual parser over the pages found that §146 is PRESENT and
# mislabelled: the source prints 146, 147 and 148 as 147, 148 and 149, and a
# duplicate 149 puts the sequence back in step. Verified against the English
# text at vatican.va, which is authoritative for the numbering.
#
# Ingested as printed, `ccc:147` would have returned §146's text — a locator
# that resolves, a quotation that verifies byte-exactly, and the wrong
# paragraph. Three units, silently. That is the precise failure class the
# project exists to prevent, and no check downstream of ingestion can see it.
#
# The correct total is 2,865: the whole Catechism, nothing missing.
#
# WHAT THIS FILE IS FOR
#   The parser asserts three things (ADR-019): the printed number and the anchor
#   agree, the sequence is complete and strictly increasing, and the final count
#   matches. Every entry below is a place one of those fires on a fault that has
#   been looked at. An UNDECLARED failure is a new defect and stops the ingest.
#
#   Its more important job is second-order: it keeps the six known faults from
#   being used as an argument for loosening the assertions.
#
# WHAT THIS FILE IS NOT
#   Locators and defect kinds only. NO corpus text — not one word — so it ships
#   under ADR-003. `repair` names the signal recovered from, never a literal.
#
# EVERY ANCHOR IN THIS SOURCE THAT DISAGREES WITH ITS PRINTED NUMBER IS THE
# ANCHOR'S FAULT. That asymmetry is why the printed number is authoritative and
# the anchor is the cross-check, and not the other way round.

source: ccc
language: hu
inventoried: 2026-09-07
expected_units: 2865
parsed_units: 2865          # complete; there are no missing paragraphs
anchors_well_formed: 2857

# ── Misnumbered paragraphs ──────────────────────────────────────────────────
# The source prints the wrong number. Addressed by (page, printed label,
# occurrence) rather than by position in the run, so a declaration survives the
# page being re-slugged or re-typeset.
#
# These are DECLARED, never inferred. A parser that detected drift and shifted
# labels back would be guessing at intent across a region whose end it cannot
# see; four entries checked against the authoritative text are a fact. The
# `verified_against` field says how each was established.

relabels:
  # A +1 drift over three paragraphs, absorbed by the duplicate 149.
  - page: kek-052-063
    found_label: 147
    occurrence: 1
    correct_locator: ccc:146
    verified_against: "vatican.va ENG0015 §146 — Abraham and the definition of faith in Hebrews 11:1"

  - page: kek-052-063
    found_label: 148
    occurrence: 1
    correct_locator: ccc:147
    verified_against: "vatican.va ENG0015 §147 — the Old Testament's witnesses to this faith"

  - page: kek-052-063
    found_label: 149
    occurrence: 1
    correct_locator: ccc:148
    verified_against: "vatican.va ENG0015 §148 — the Virgin Mary embodies the obedience of faith"
    note: >
      The SECOND paragraph labelled 149 on this page is correctly numbered and
      is left alone. Which is which is decided by occurrence, not by content.

  # A single mislabelled paragraph, no drift: the sequence resumes at 212.
  - page: kek-067-120
    found_label: 210
    occurrence: 2
    correct_locator: ccc:211
    verified_against: "vatican.va ENG0015 §211 — the divine name 'I Am' expresses God's faithfulness"
    note: >
      THE IMPORTANT ONE. Anchor `K0210` and printed number `210.` agree with
      each other and are both wrong, so the agreement check passes and this
      paragraph is filed as a duplicate §210 — losing §211 and gaining a second
      §210, with every other check green. Only the strictly-increasing
      assertion catches it. Delete that assertion as redundant and this defect
      returns silently.

# ── Permitted anchor defects ────────────────────────────────────────────────
# Known, looked at, and recoverable from the printed number. Never a wildcard:
# the pair (locator, kind) must match exactly, so a DIFFERENT fault at the same
# locator still fails.

allowed:
  - locator: ccc:74
    kind: anchor-missing-prefix
    found: 'name="74"'
    expected: 'name="K0074"'
    repair: printed-number
    page: kek-031-051

  - locator: ccc:2096
    kind: anchor-absent
    repair: printed-number
    page: kek-541-565
    note: >
      No anchor, and the printed number carries no trailing period either — a
      pattern requiring `N.` will not match it. Accepted because the sequence
      expects 2096 at that position; a bare number alone is not sufficient
      evidence of a paragraph (see § Not errata).

  - locator: ccc:2213
    kind: anchor-absent
    repair: printed-number
    page: kek-566-644

  - locator: ccc:2621
    kind: anchor-typo
    found: 'name="K26201"'
    expected: 'name="K2621"'
    repair: printed-number
    page: kek-650-670
    note: >
      A trailing 1. Trusting anchors blindly would also mint a spurious
      locator, ccc:26201 — which is what the agreement check catches.

# ── The In Brief label, and the heading that hid behind it ──────────────────
# A unit's `role` comes from the Összefoglalás label that opens its block, not
# from its italics (lib/corpus/in-brief.ts). This edition italicises §112–§114
# and §116–§117 — the criteria for interpreting Scripture and the senses of
# Scripture, ordinary paragraphs — so the old rule marked them as summaries and
# disagreed with the English document about 122 units.
#
# Two structural facts, both found by making that correction, both listed here
# because each broke something and neither is visible from this document alone:
#
#   * ONE LABEL IS SET OUTSIDE ANY <p>: `</p> <b>Összefoglalás</b> <p>` on
#     kek-566-644. The paragraph scanner never saw it and §2504–§2513 lost their
#     role. The Jegyzetek problem again — a label here is not reliably an
#     element.
#
#   * `3.§ A Mindenható` ON kek-067-120 IS A HEADING NOTHING RECOGNISED. Its
#     siblings are set `2.§ AZ ATYA`, `4. § A TEREMTŐ` — capitals, caught by the
#     all-caps rule — and this one alone is in mixed case. It was not blanked,
#     so its text was appended to §267, which SHIPPED that way: one unit out of
#     2,865, reading as prose, invisible to the count, the sequence, both anchor
#     signals and every text probe. It was found only because the In Brief block
#     it failed to close ran on into §268–§271 and the cross-lingual role
#     comparison flagged them.
#
#     A centred paragraph is now a heading in this source. 195 of them, every
#     one a section title or the "Vissza a főoldalra" link, not one a citable
#     paragraph — and the anchor test still comes first, so a centred numbered
#     paragraph would remain a unit.
#
#     `heading-centred` counts 7. It is checked LAST, after every other rule, so
#     the counter means "a heading nothing else recognised" and a jump in it is
#     a signal rather than noise.

# ── Text probes ─────────────────────────────────────────────────────────────
# ADR-019's third method step, and the one this source paid for. The footnote
# apparatus leaked into §1065 and §1666 with the count at 2,865, the sequence
# strictly increasing, both signals agreeing everywhere and the errata fully
# declared — invisible to every assertion above, because the units still read
# as prose. It was found by a query over the stored text run by hand.
#
# ADR-019 then claimed those probes had become part of `integration/`. They had
# not, and the English ingest paid the cost by running them by hand again. They
# are automated now; this section is what makes them strict rather than
# advisory.
#
# `furniture` names words belonging to katolikus.hu's page template. "Jegyzetek"
# is the apparatus label whose three markup shapes cost two corrupted units, so
# it is the single most valuable line in this file.

text_probes:
  furniture:
    - Jegyzetek

  expected:
    - locator: ccc:112
      probe: leading-marker-residue
      note: >
        Opens "1." — the first of the three criteria for interpreting Scripture
        set out in §111, not a marker's number left behind. §222's genuine
        marker residue is stripped at ingest and does not appear here.

    - locator: ccc:113
      probe: leading-marker-residue
      note: The second of the same three criteria.

    - locator: ccc:114
      probe: leading-marker-residue
      note: The third of the same three criteria.

# ── Not errata ──────────────────────────────────────────────────────────────
# Structural quirks the parser handles without a declaration, listed so nobody
# re-discovers them as bugs. Each one broke an earlier draft.
#
#   * Front matter — kek-005-006, kek-007-008, kek-009-011, kek-012-016 carry no
#     numbered paragraphs at all. Laetamur magnopere, Fidei depositum and the
#     prologue are unnumbered in the printed book too. They are not citable
#     units under `ccc:<paragraph>`; giving them one would mean a synthetic
#     locator scheme (ADR-002).
#
#   * A dateline is not a paragraph. The front matter ends "2002. Szent Péter és
#     Pál ünnepén". A leading number is therefore accepted only when the
#     paragraph carries an anchor, or the number is the one the sequence expects.
#
#   * §78 begins mid-<p>, after a <br><br>, inside its predecessor's element. A
#     unit boundary in this source is not an element boundary.
#
#   * §1077 and others: the anchor swallows the paragraph's opening quotation
#     mark — <a name="K1077">1077. „</a> — so the marker is the NUMBER only and
#     the „ has to survive into the text.
#
#   * §1182, §1353: the number is wrapped in <font size="-1"> inside the anchor.
#
#   * §222: the marker prints its period twice — <a …>222.</a>. — leaving the
#     unit text to begin ". ".
#
#   * Footnote reference anchors appear with their attributes in either order,
#     `<a name="JB7" href="#J7">` and `<a href="#J64" name="JB64">`. Matching
#     only the first form leaves [64] markers in 1,586 units, invisibly, since
#     the text still reads as prose.
#
#   * A bold heading may start with a digit ("2. Cikkely"). It creates no
#     spurious unit — a marker needs corroboration — but if it is not removed
#     its text is appended to the PRECEDING paragraph.
