pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,ts,jsx,tsx}"
      run: npx eslint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: npx tsc --noEmit
    # Cheap enough to belong here; the E2E suite is not (it needs a Supabase
    # stack and a build) and stays a CI-and-on-demand gate.
    - name: unit tests
      run: npm test
    - name: docs structure
      run: npm run docs:lint
