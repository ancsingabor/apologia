name: CI

# Run the Playwright E2E suite unattended in the cloud on every PR (and on
# pushes to main). The same gate you run locally (`npm run test:e2e`). The suite
# targets a free, ephemeral local Supabase stack started here on the runner —
# the production cloud project and its secrets are never touched.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref; cancel superseded runs (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python measurement harness (ADR-023). A separate job rather than a step
  # in `verify`, for the same reason the unit suite is ordered before the
  # Supabase stack there: this gate is service-free and sub-second, so it should
  # fail in its own lane in under a minute instead of queueing behind a Node
  # install, a stack boot and a Next build it has nothing to do with.
  #
  # What it gates is the deterministic half only — metric functions, gold-set
  # parsing, and the corpus-hash port's agreement with `lib/corpus/hash.ts`. The
  # embedding bake-off and the eval run are NOT here: they need a database, they
  # cost money, and they are operator-initiated. That is ADR-004's argument about
  # ingestion applied unchanged to the same shape of job.
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: harness/uv.lock

      # --frozen: fail if uv.lock disagrees with pyproject.toml rather than
      # silently resolving something new. The harness exists to produce
      # reproducible measurements; a CI run on an unpinned dependency set is not
      # checking the code anyone will actually run.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy apologia_eval tests

      - name: Unit tests
        run: uv run pytest

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Ordered before the Supabase stack on purpose: the deterministic suite is
      # sub-second and needs no services, so a parser or verifier regression
      # fails the job in seconds rather than after a stack boot and a build.
      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Pinned to a version validated locally, not `latest` — a moving CLI is
          # a moving test environment. The old pin at 2.90.0 was working around
          # `permission denied for table …` on newer stacks; that was never a CLI
          # bug but missing GRANTs in the schema itself, now stated explicitly in
          # `supabase/migrations/0004_schema_grants.sql`. Bumping is routine:
          # upgrade locally, run `npm run test:e2e`, move this number.
          #
          # setup-cli v3 resolves this from npm rather than GitHub releases, so
          # the number must exist as a published `supabase` package version. It
          # would also detect a version from the root lockfile if this input were
          # dropped — deliberately not done: the CLI is not an app dependency,
          # and an explicit pin is the thing being argued for above.
          version: 2.114.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Export local stack credentials to the job env
        # Mirrors scripts/e2e.sh: capture the CLI's local demo keys and expose the
        # app-facing aliases so `next build` (static generation reaches Supabase)
        # and the E2E run both point at the ephemeral local stack.
        run: |
          set -euo pipefail
          eval "$(supabase status -o env 2>/dev/null | grep -E '^[A-Z0-9_]+=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "E2E_BASE_URL=http://localhost:3000"
            echo "RESEND_API_KEY=e2e-dummy"
            echo "CRON_SECRET=e2e-dummy"
          } >> "$GITHUB_ENV"

      # Ordered before the build: these need the stack that is already up, and
      # nothing else. A broken ingest upsert should not wait on a Next build.
      # `npm run test:integration` re-runs `supabase start` / `migration up`
      # idempotently, so it is safe here even though the stack is already going.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
