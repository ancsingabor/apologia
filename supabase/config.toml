# Supabase local config. Full reference:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "apologia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Studio / inbucket / edge-runtime are not needed by the E2E suite (which only
# uses Postgres + Auth + PostgREST). Disabling them makes `supabase start` faster
# and avoids flaky health checks on those containers. Re-enable any you need for
# local development.
[studio]
enabled = false
port = 54323

[inbucket]
enabled = false
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
# Production admin login is magic-link / OTP. For E2E we create a local-only test
# admin with a password (see e2e/auth.ts); real login is unchanged.

[edge_runtime]
enabled = false
policy = "per_worker"
